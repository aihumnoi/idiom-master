name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "platform-tools" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IdiomMaster-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            android/app/build/reports/
            ~/.gradle/daemon/
          retention-days: 7
