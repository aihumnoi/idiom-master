name: CI — เสาเข็ม

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --config vitest.config.ts
      - run: npx vite build
